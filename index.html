<script>
const $ = id => document.getElementById(id);
$('app').outerHTML = `<div class="app"><div class="sidebar"><div class="s-head"><div class="logo">⚡ NeonChat</div><div style="display:flex;gap:4px"><button class="sq-btn plus-btn" id="openM">+</button><button class="sq-btn" id="openP">🎭</button><button class="sq-btn" id="openOn">🌐</button><button class="sq-btn" id="themeBtn">🌓</button></div></div><div id="pBar" style="padding:8px 14px;font-size:.78rem;background:rgba(139,92,246,.15);border-bottom:1px solid var(--brd);cursor:pointer">🎭 Роль: <b id="pName">Ты</b></div><div class="c-list" id="cList"></div></div><div class="main"><div class="m-head"><div style="display:flex;align-items:center"><div class="ava" id="hAva">🤖</div><div><b id="hName">Бот</b><div style="font-size:.75rem;color:#10b981" id="hStat">● в сети</div></div></div><div><button class="d-btn" id="clrBtn">Очистить</button> <button class="d-btn" id="delBtn" style="display:none">Удалить</button></div></div><div class="msgs" id="msgs"></div><div class="inp-box"><div class="emojis" id="emBox"></div><button class="sq-btn" style="border:none" id="emBtn">😊</button><input id="msgIn" placeholder="Сообщение..."><button class="send" id="sendBtn">➤</button></div></div><div class="modal" id="modal"><div class="m-box"><h3>✨ Новый чат</h3><input class="m-inp" id="newName" placeholder="Имя бота или название"><div class="avas" id="avGrid"></div><label style="font-size:.85rem"><input type="checkbox" id="botChk" checked> Бот отвечает</label><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="sq-btn" style="width:auto;padding:0 12px" id="closeM">Отмена</button><button class="send" id="addBtn">Создать</button></div></div></div><div class="modal" id="pModal"><div class="m-box"><h3>🎭 Твоя Персона</h3><input class="m-inp" id="pInName" placeholder="Имя персонажа"><textarea class="m-inp" id="pInDesc" rows="3" placeholder="Описание характера..."></textarea><div style="display:flex;justify-content:space-between;margin-top:10px"><button class="d-btn" id="resetP">Сбросить</button><div style="display:flex;gap:8px"><button class="sq-btn" style="width:auto;padding:0 12px" id="closeP">Отмена</button><button class="send" id="saveP">Сохранить</button></div></div></div></div></div>`;
const srv = 'https://' + 'ntfy.sh/';
const myUid = localStorage.getItem('nc_uid') || ('u_' + Math.random().toString(36).slice(2));
localStorage.setItem('nc_uid', myUid);

const defC = [{id:'bot',name:'Кибер-Бот',ava:'🤖',bot:true,def:true},{id:'cat',name:'Кот Батон',ava:'🐱',bot:true,def:true},{id:'fav',name:'Избранное',ava:'📌',bot:false,def:true}];
const avas = ['😎','👽','🦊','🚀','💎','🎮','👻','🧠','🔥','👑'];
const ems = ['😂','🔥','❤️','👍','😎','🚀','🎉','🤔','👀','✨','💯','🐱'];
const now = () => new Date().toTimeString().slice(0,5);
let contacts = JSON.parse(localStorage.getItem('nc6_c')) || defC;
let hist = JSON.parse(localStorage.getItem('nc6_h')) || {bot:[{t:'Привет! Нажми 🎭 для персоны или 🌐 для чата с другом! 🚀',type:'in',time:now()}],cat:[{t:'Мяу! 🐟',type:'in',time:now()}],fav:[]};
let persona = JSON.parse(localStorage.getItem('nc6_p')) || {name:'',desc:''};
let curId = contacts.at(0).id, selAva = avas.at(0), onlineTopic = '', seenIds = {}, pollTimer = null;
const save = () => { localStorage.setItem('nc6_c',JSON.stringify(contacts)); localStorage.setItem('nc6_h',JSON.stringify(hist)); localStorage.setItem('nc6_p',JSON.stringify(persona)); };
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function updP(){ $('pName').textContent = persona.name ? persona.name + (persona.desc ? ' ('+persona.desc.slice(0,15)+'...)' : '') : 'Ты (без роли)'; }
function renderList(){
  $('cList').innerHTML = contacts.map(c => {
    const m = hist[c.id]||[], last = m.length ? esc(m.at(-1).t) : 'Нет сообщений';
    return `<div class="c-item ${c.id===curId?'active':''}" onclick="sw('${c.id}')"><div class="ava">${c.ava}</div><div><b>${esc(c.name)}</b><div class="c-prev">${last}</div></div></div>`;
  }).join('');
}
window.sw = id => {
  curId = id; const c = contacts.find(x=>x.id===id); if(!c) return;
  $('hName').textContent = c.name; $('hAva').textContent = c.ava; $('hStat').textContent = c.id==='online'?'● онлайн-комната':(c.bot?'● в сети':'● заметки');
  $('delBtn').style.display = c.def ? 'none' : 'inline-block'; renderList(); renderMsgs();
};
function renderMsgs(){
  $('msgs').innerHTML = (hist[curId]||[]).map(m=>`<div class="msg ${m.type}">${m.role?`<div style="font-size:.7rem;opacity:.8;margin-bottom:3px">🎭 ${esc(m.role)}</div>`:''}${esc(m.t)}<div class="time">${m.time}</div></div>`).join('');
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function send(){
  const t = $('msgIn').value.trim(); if(!t) return;
  const role = persona.name || '';
  (hist[curId]=hist[curId]||[]).push({t,type:'out',time:now(),role}); $('msgIn').value=''; save(); renderMsgs(); renderList();
  if(curId==='online' && onlineTopic){
    fetch(srv+encodeURIComponent(onlineTopic),{method:'POST',body:JSON.stringify({u:myUid,s:role||'Друг',t})}).catch(()=>{ $('hStat').textContent='⚠ ошибка сети'; });
    return;
  }
  const c = contacts.find(x=>x.id===curId);
  if(c && c.bot){
    $('hStat').textContent = 'печатает...';
    setTimeout(()=>{
      const p = persona.name ? persona.name + ', ' : '';
      const r = curId==='cat' ? ['Мяу! 🐾','Мур-мур...','Дай колбасы! 🌭'].at(Math.floor(Math.random()*3)) : [`${p}звучит эпично! 🔥`, `${p}интересный поворот сюжета 👀`, `Полностью в твоём стиле${persona.name?' ('+persona.name+')':''}! 💯`, `*смотрит с интересом* Продолжай, ${persona.name||'друг'}! ✨`].at(Math.floor(Math.random()*4));
      hist[curId].push({t:r,type:'in',time:now()}); $('hStat').textContent='● в сети'; save(); renderMsgs(); renderList();
    },700);
  }
}

async function pollOnline(){
  if(!onlineTopic) return;
  try {
    const res = await fetch(srv+encodeURIComponent(onlineTopic)+'/json?poll=1&since=10m');
    const txt = await res.text();
    let added = false;
    txt.trim().split('\n').forEach(line => {
      if(!line) return;
      const d = JSON.parse(line);
      if(d.event==='message' && !seenIds[d.id]){
        seenIds[d.id] = true;
        const m = JSON.parse(d.message);
        if(m.u !== myUid){ hist['online'].push({t:m.t,role:m.s,type:'in',time:now()}); added = true; }
      }
    });
    if(added){ save(); renderMsgs(); renderList(); }
    if(curId==='online') $('hStat').textContent = '● онлайн (на связи)';
  } catch(e){ if(curId==='online') $('hStat').textContent = '⚠ нет связи с сервером'; }
}

$('openP').onclick = $('pBar').onclick = () => { $('pInName').value=persona.name; $('pInDesc').value=persona.desc; $('pModal').classList.add('show'); };
$('closeP').onclick = () => $('pModal').classList.remove('show');
$('saveP').onclick = () => { persona={name:$('pInName').value.trim(),desc:$('pInDesc').value.trim()}; save(); updP(); $('pModal').classList.remove('show'); };
$('resetP').onclick = () => { persona={name:'',desc:''}; save(); updP(); $('pModal').classList.remove('show'); };

$('openOn').onclick = () => {
  const room = prompt('Введи секретный код комнаты (одинаковый с другом):'); if(!room) return;
  onlineTopic = 'neonchat_v2_' + room.trim().toLowerCase();
  seenIds = {};
  contacts = contacts.filter(x=>x.id!=='online');
  contacts.unshift({id:'online',name:'🌐 '+room,ava:'🔥',bot:false,def:true});
  hist['online'] = hist['online'] || []; sw('online');
  if(pollTimer) clearInterval(pollTimer);
  pollOnline();
  pollTimer = setInterval(pollOnline, 1500);
};

$('avGrid').innerHTML = avas.map((a,i)=>`<div class="av-opt ${i===0?'sel':''}" onclick="pickA(this,'${a}')">${a}</div>`).join('');
window.pickA = (el,a) => { document.querySelectorAll('.av-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selAva=a; };
$('openM').onclick = () => { $('newName').value=''; $('modal').classList.add('show'); $('newName').focus(); };
$('closeM').onclick = () => $('modal').classList.remove('show');
$('addBtn').onclick = () => {
  const name = $('newName').value.trim(); if(!name) return;
  const id = 'c_'+Date.now(), bot = $('botChk').checked;
  contacts.unshift({id,name,ava:selAva,bot,def:false});
  hist[id] = bot ? [{t:`Привет! Я ${name} 👋`,type:'in',time:now()}] : [];
  save(); $('modal').classList.remove('show'); sw(id);
};
$('delBtn').onclick = () => { contacts=contacts.filter(x=>x.id!==curId); delete hist[curId]; save(); sw(contacts.at(0).id); };
$('emBox').innerHTML = ems.map(e=>`<span class="em" onclick="$('msgIn').value+='${e}'">${e}</span>`).join('');
$('emBtn').onclick = e => { e.stopPropagation(); $('emBox').classList.toggle('show'); };
document.onclick = () => $('emBox').classList.remove('show');
$('themeBtn').onclick = () => document.body.classList.toggle('light');
$('clrBtn').onclick = () => { hist[curId]=[]; save(); renderMsgs(); renderList(); };
$('sendBtn').onclick = send;
$('msgIn').onkeypress = e => { if(e.key==='Enter') send(); };
updP(); sw(curId);
</script>
</body>
</html>
