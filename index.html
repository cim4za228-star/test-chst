<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonChat</title>
<style>
:root{--bg:#0f172a;--side:#1e293b;--chat:#0b1120;--out:linear-gradient(135deg,#6366f1,#8b5cf6);--in:#1e293b;--txt:#f8fafc;--mut:#94a3b8;--acc:#8b5cf6;--brd:#334155}
body.light{--bg:#f1f5f9;--side:#fff;--chat:#e2e8f0;--out:linear-gradient(135deg,#3b82f6,#2563eb);--in:#fff;--txt:#0f172a;--mut:#64748b;--acc:#3b82f6;--brd:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:95%;max-width:960px;height:90vh;background:var(--side);border-radius:20px;display:flex;overflow:hidden;border:1px solid var(--brd);position:relative}
.sidebar{width:270px;border-right:1px solid var(--brd);display:flex;flex-direction:column}
.s-head{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd)}
.logo{font-size:1.1rem;font-weight:800;color:var(--acc)}
.sq-btn{background:none;border:1px solid var(--brd);color:var(--txt);width:30px;height:30px;border-radius:8px;cursor:pointer}
.plus-btn{background:var(--out);color:#fff;border:none;font-weight:bold}
.u-bar{padding:8px 14px;background:rgba(99,102,241,.14);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;font-size:.82rem;cursor:pointer}
.c-list{flex:1;overflow-y:auto;padding:8px}
.c-item{display:flex;align-items:center;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.c-item.active{background:rgba(139,92,246,.2);border:1px solid var(--acc)}
.ava{width:40px;height:40px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:1.3rem;margin-right:10px;background:var(--chat);flex-shrink:0}
.c-prev{font-size:.8rem;color:var(--mut);max-width:155px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column;background:var(--chat)}
.m-head{padding:14px 20px;background:var(--side);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.d-btn{background:none;border:1px solid #ef4444;color:#ef4444;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.8rem}
.m-btn{background:rgba(139,92,246,.15);border:1px solid var(--acc);color:var(--txt);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.8rem;margin-right:6px}
.msgs{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:10px 14px;border-radius:16px;font-size:.95rem;word-wrap:break-word;cursor:pointer}
.msg.out{align-self:flex-end;background:var(--out);color:#fff}
.msg.in{align-self:flex-start;background:var(--in);border:1px solid var(--brd)}
.q-box{background:rgba(0,0,0,.22);border-left:3px solid #fff;padding:4px 8px;border-radius:6px;font-size:.78rem;margin-bottom:6px;opacity:.9}
.msg.in .q-box{border-left-color:var(--acc);background:rgba(139,92,246,.12)}
.msg img{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-top:4px}
.time{font-size:.65rem;opacity:.85;margin-top:4px;text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:4px}
.chk{font-weight:bold;letter-spacing:-1px}
.chk.read{color:#38bdf8;text-shadow:0 0 6px rgba(56,189,248,.6)}
.r-bar{padding:6px 14px;background:var(--side);border-top:1px solid var(--brd);display:none;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--mut)}
.inp-box{padding:12px;background:var(--side);border-top:1px solid var(--brd);display:flex;gap:8px;position:relative}
.emojis{position:absolute;bottom:62px;left:12px;background:var(--side);border:1px solid var(--brd);padding:8px;border-radius:12px;display:none;gap:6px;flex-wrap:wrap;width:210px;z-index:20}
.emojis.show{display:flex}
.em{font-size:1.3rem;cursor:pointer}
#msgIn{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--brd);background:var(--chat);color:var(--txt);outline:none}
.send{background:var(--out);color:#fff;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;z-index:99}
.modal.show{display:flex}
.m-box{background:var(--side);border:1px solid var(--brd);padding:20px;border-radius:16px;width:320px}
.m-inp{width:100%;padding:8px;border-radius:8px;border:1px solid var(--brd);background:var(--chat);color:var(--txt);margin:8px 0 12px;outline:none}
.avas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.av-opt{width:34px;height:34px;border-radius:8px;background:var(--chat);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent}
.av-opt.sel{border-color:var(--acc)}
.mem-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--brd);font-size:.9rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = id => document.getElementById(id);
$('app').outerHTML = `<div class="app"><div class="sidebar"><div class="s-head"><div class="logo">⚡ NeonChat</div><div style="display:flex;gap:4px"><button class="sq-btn plus-btn" id="openM">+</button><button class="sq-btn" id="openP">🎭</button><button class="sq-btn" id="openOn">🌐</button><button class="sq-btn" id="themeBtn">🌓</button></div></div><div class="u-bar" id="accBar" title="Изменить аккаунт"><span id="accInfo">👤 Аккаунт</span><span style="font-size:.7rem;color:var(--acc)">✎</span></div><div id="pBar" style="padding:6px 14px;font-size:.75rem;background:rgba(139,92,246,.08);border-bottom:1px solid var(--brd);cursor:pointer">🎭 Роль: <b id="pName">Нет</b></div><div class="c-list" id="cList"></div></div><div class="main"><div class="m-head"><div style="display:flex;align-items:center"><div class="ava" id="hAva">🤖</div><div><b id="hName">Бот</b><div style="font-size:.75rem;color:#10b981" id="hStat">● в сети</div></div></div><div><button class="m-btn" id="memBtn" style="display:none">👥 1</button><button class="d-btn" id="clrBtn">Очистить</button> <button class="d-btn" id="delBtn" style="display:none">Удалить</button></div></div><div class="msgs" id="msgs"></div><div class="r-bar" id="rBar"><span id="rTxt"></span><button class="sq-btn" style="border:none" id="rCan">✕</button></div><div class="inp-box"><div class="emojis" id="emBox"></div><button class="sq-btn" style="border:none" id="emBtn">😊</button><button class="sq-btn" style="border:none" id="imgBtn">📷</button><input type="file" id="imgIn" accept="image/*" style="display:none"><input id="msgIn" placeholder="Сообщение..."><button class="send" id="sendBtn">➤</button></div></div><div class="modal" id="modal"><div class="m-box"><h3>✨ Новый чат</h3><input class="m-inp" id="newName" placeholder="Имя бота"><div class="avas" id="avGrid"></div><label style="font-size:.85rem"><input type="checkbox" id="botChk" checked> Бот отвечает</label><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="sq-btn" style="width:auto;padding:0 12px" id="closeM">Отмена</button><button class="send" id="addBtn">Создать</button></div></div></div><div class="modal" id="accModal"><div class="m-box"><h3>👤 Твой Аккаунт</h3><input class="m-inp" id="accNameIn" placeholder="Придумай никнейм"><div class="avas" id="accAvGrid"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="send" id="saveAcc">Готово</button></div></div></div><div class="modal" id="memModal"><div class="m-box"><h3>👥 Участники группы</h3><div id="memList" style="max-height:240px;overflow-y:auto;margin:10px 0"></div><div style="display:flex;justify-content:flex-end"><button class="send" id="closeMem">Закрыть</button></div></div></div></div>`;
let mq=null, onlineOk=false, replyData=null, members={}, chunks={};
const myUid=localStorage.getItem('nc_uid')||('u_'+Math.random().toString(36).slice(2));
localStorage.setItem('nc_uid',myUid);
const defC=[{id:'bot',name:'Кибер-Бот',ava:'🤖',bot:true,def:true},{id:'cat',name:'Кот Батон',ava:'🐱',bot:true,def:true},{id:'fav',name:'Избранное',ava:'📌',bot:false,def:true}];
const avas=['😎','👽','🦊','🚀','💎','🎮','👻','🧠','🔥','👑'], ems=['😂','🔥','❤️','👍','😎','🚀','🎉','🤔','👀','✨','💯','🐱'];
const now=()=>new Date().toTimeString().slice(0,5);

let db=JSON.parse(localStorage.getItem('neonchat_permanent'))||{acc:null,c:defC,h:{bot:[{t:'Переписка зашифрована ключом комнаты 🔒',type:'in',time:now()}],cat:[{t:'Мяу! 🐟',type:'in',time:now()}],fav:[]},p:{name:'',desc:''},cur:'bot'};
let acc=db.acc, contacts=db.c, hist=db.h, persona=db.p;
let curId=contacts.find(x=>x.id===db.cur)?db.cur:contacts.at(0).id, selAva=avas.at(0), selAccAva=avas.at(0);

const save=()=>{db={acc,c:contacts,h:hist,p:persona,cur:curId};try{localStorage.setItem('neonchat_permanent',JSON.stringify(db))}catch(e){Object.keys(hist).forEach(k=>{if(hist[k].length>15)hist[k]=hist[k].slice(-15)});try{localStorage.setItem('neonchat_permanent',JSON.stringify(db))}catch(x){}}};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const crypt=(str,k)=>{if(!str)return'';const b=new TextEncoder().encode(str),kb=new TextEncoder().encode(k||'nc'),r=new Uint8Array(b.length);for(let i=0;i<b.length;i++)r[i]=b[i]^kb[i%kb.length];let s='';r.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const decrypt=(b64,k)=>{if(!b64)return'';try{const s=atob(b64),kb=new TextEncoder().encode(k||'nc'),r=new Uint8Array(s.length);for(let i=0;i<s.length;i++)r[i]=s.charCodeAt(i)^kb[i%kb.length];return new TextDecoder().decode(r)}catch(e){return''}};

const sEl=document.createElement('script');
sEl.src=['https:/','unpkg.com','mqtt','dist','mqtt.min.js'].join('/');
sEl.onload=()=>{
  mq=mqtt.connect('wss://'+'broker.emqx.io:8084/mqtt');
  mq.on('connect',()=>{onlineOk=true;contacts.forEach(c=>{if(c.room){mq.subscribe(c.room);pingRoom(c)}});if(curId.startsWith('rm_')){$('hStat').textContent='🔒 шифрование активно';sendRead(contacts.find(x=>x.id===curId))}});
  mq.on('message',(topic,payload)=>{try{const m=JSON.parse(payload.toString()),c=contacts.find(x=>x.room===topic);if(!c)return;if(m.u){(members[c.id]=members[c.id]||{})[m.u]={n:m.un||'Гость',a:m.ua||'👤',ts:Date.now()};updMemUI()}if(m.u===myUid||m.act==='ping')return;if(m.act==='read'){(hist[c.id]||[]).forEach(x=>{if(x.type==='out')x.rd=true});save();if(curId===c.id)renderMsgs();return}const k=c.id;if(m.cid){const b=chunks[m.cid]=chunks[m.cid]||{p:[],tot:m.tot};b.p[m.idx]=m.d;if(b.p.filter(Boolean).length===b.tot){delete chunks[m.cid];(hist[c.id]=hist[c.id]||[]).push({t:decrypt(m.t,k),img:decrypt(b.p.join(''),k),q:decrypt(m.q,k),role:m.s,type:'in',time:now()});save();if(curId===c.id){renderMsgs();sendRead(c)}renderList()}return}(hist[c.id]=hist[c.id]||[]).push({t:decrypt(m.t,k),img:decrypt(m.img,k),q:decrypt(m.q,k),role:m.s,type:'in',time:now()});save();if(curId===c.id){renderMsgs();sendRead(c)}renderList()}catch(e){}});
};
document.head.appendChild(sEl);

function pingRoom(c){if(!c||!c.room||!mq||!onlineOk||!acc)return;(members[c.id]=members[c.id]||{})[myUid]={n:acc.name,a:acc.ava,ts:Date.now()};mq.publish(c.room,JSON.stringify({u:myUid,un:acc.name,ua:acc.ava,act:'ping'}));updMemUI()}
setInterval(()=>{contacts.forEach(c=>{if(c.room)pingRoom(c)})},4000);
function sendRead(c){if(c&&c.room&&mq&&onlineOk&&!document.hidden)mq.publish(c.room,JSON.stringify({u:myUid,un:acc?acc.name:'',ua:acc?acc.ava:'',act:'read'}))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sendRead(contacts.find(x=>x.id===curId))});
function updMemUI(){const c=contacts.find(x=>x.id===curId);if(!c||!c.room){$('memBtn').style.display='none';return}$('memBtn').style.display='inline-block';const list=members[c.id]||{},active=Object.entries(list).filter(([k,v])=>Date.now()-v.ts<15000);$('memBtn').textContent='👥 '+Math.max(1,active.length);$('memList').innerHTML=active.length?active.map(([k,v])=>`<div class="mem-row"><span style="font-size:1.4rem">${v.a}</span><b>${esc(v.n)}</b>${k===myUid?' <span style="color:var(--acc);font-size:.75rem">(ты)</span>':''}</div>`).join(''):'<div style="color:var(--mut)">Пока никого нет</div>'}
$('memBtn').onclick=()=>{updMemUI();$('memModal').classList.add('show')};
$('closeMem').onclick=()=>$('memModal').classList.remove('show');

function updAccUI(){$('accInfo').textContent=acc?(acc.ava+' '+acc.name):'👤 Создать аккаунт';$('pName').textContent=persona.name?persona.name:'Нет (используется аккаунт)'}
$('accAvGrid').innerHTML=avas.map((a,i)=>`<div class="av-opt ${i===0?'sel':''}" onclick="pickAccA(this,'${a}')">${a}</div>`).join('');
window.pickAccA=(el,a)=>{document.querySelectorAll('#accAvGrid .av-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selAccAva=a};
$('accBar').onclick=()=>{$('accNameIn').value=acc?acc.name:'';$('accModal').classList.add('show');$('accNameIn').focus()};
$('saveAcc').onclick=()=>{const n=$('accNameIn').value.trim();if(!n)return $('accNameIn').focus();acc={name:n,ava:selAccAva};save();updAccUI();$('accModal').classList.remove('show');contacts.forEach(c=>{if(c.room)pingRoom(c)})};

function renderList(){$('cList').innerHTML=contacts.map(c=>{const m=hist[c.id]||[],last=m.length?(m.at(-1).img?'📷 Фото':esc(m.at(-1).t)):'Нет сообщений';return`<div class="c-item ${c.id===curId?'active':''}" onclick="sw('${c.id}')"><div class="ava">${c.ava}</div><div><b>${esc(c.name)}</b><div class="c-prev">${last}</div></div></div>`}).join('')}
window.sw=id=>{curId=id;save();cancelReply();const c=contacts.find(x=>x.id===id);if(!c)return;$('hName').textContent=c.name;$('hAva').textContent=c.ava;$('hStat').textContent=c.room?(onlineOk?'🔒 шифрование активно':'⏳ подключение...'):(c.bot?'● в сети':'● заметки');$('delBtn').style.display=c.def?'none':'inline-block';renderList();renderMsgs();updMemUI();sendRead(c)};
window.setReply=idx=>{const m=(hist[curId]||[]).at(idx);if(!m)return;replyData=(m.role?m.role+': ':'')+(m.img?'📷 Фото':m.t).slice(0,45);$('rTxt').textContent='↩ Ответ на: '+replyData;$('rBar').style.display='flex';$('msgIn').focus()};
function cancelReply(){replyData=null;$('rBar').style.display='none'}
$('rCan').onclick=cancelReply;

function renderMsgs(){$('msgs').innerHTML=(hist[curId]||[]).map((m,i)=>`<div class="msg ${m.type}" onclick="setReply(${i})">${m.q?`<div class="q-box">↩ ${esc(m.q)}</div>`:''}${m.role?`<div style="font-size:.7rem;opacity:.85;margin-bottom:3px">${esc(m.role)}</div>`:''}${m.t?esc(m.t):''}${m.img?`<img src="${m.img}">`:''}<div class="time">${m.time}${m.type==='out'?`<span class="chk ${m.rd?'read':''}">${m.rd?'✓✓':'✓'}</span>`:''}</div></div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight}

function send(imgData){
  const t=$('msgIn').value.trim();if(!t&&!imgData)return;const sender=persona.name?('🎭 '+persona.name):(acc?(acc.ava+' '+acc.name):'Гость'), c=contacts.find(x=>x.id===curId), q=replyData||'', msgObj={t,img:imgData||'',q,type:'out',time:now(),role:persona.name?('🎭 '+persona.name):'',rd:false};
  (hist[curId]=hist[curId]||[]).push(msgObj);$('msgIn').value='';cancelReply();save();renderMsgs();renderList();
  if(c&&c.room&&mq){
    const k=c.id, et=crypt(t,k), eq=crypt(q,k), ei=crypt(imgData||'',k);
    if(ei){const cid=Date.now()+'_'+Math.random().toString(36).slice(2,6),sz=3500,tot=Math.ceil(ei.length/sz);for(let i=0;i<tot;i++)mq.publish(c.room,JSON.stringify({u:myUid,un:acc?acc.name:'Гость',ua:acc?acc.ava:'👤',s:sender,t:i===0?et:'',q:i===0?eq:'',cid,idx:i,tot,d:ei.slice(i*sz,(i+1)*sz)}));return}
    mq.publish(c.room,JSON.stringify({u:myUid,un:acc?acc.name:'Гость',ua:acc?acc.ava:'👤',s:sender,t:et,q:eq}));return;
  }
  if(c&&c.bot){$('hStat').textContent='печатает...';setTimeout(()=>{msgObj.rd=true;const r=imgData?'Ого, крутая фотка! 🔥':(curId==='cat'?'Мяу! 🐾':['Звучит мощно! 🚀','В твоём стиле! 💯','Интересно 👀'][Math.floor(Math.random()*3)]);hist[curId].push({t:r,type:'in',time:now()});$('hStat').textContent='● в сети';save();renderMsgs();renderList()},700)}
}

$('imgBtn').onclick=()=>$('imgIn').click();
$('imgIn').onchange=e=>{const f=e.target.files.at(0);if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas'),max=320,sc=Math.min(1,max/Math.max(im.width,im.height));cv.width=im.width*sc;cv.height=im.height*sc;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);send(cv.toDataURL('image/jpeg',0.55))};im.src=ev.target.result};r.readAsDataURL(f);e.target.value=''};

$('pBar').onclick=$('openP').onclick=()=>{const n=prompt('Имя Персоны для ролки (пусто = писать от своего аккаунта):',persona.name);if(n===null)return;persona={name:n.trim(),desc:''};save();updAccUI()};
$('openOn').onclick=()=>{const r=prompt('Код новой группы/комнаты (одинаковый с друзьями):');if(!r)return;const code=r.trim().toLowerCase(), id='rm_'+code, topic='neonchat/live/'+code;if(!contacts.find(x=>x.id===id))contacts.unshift({id,name:'🌐 '+r.trim(),ava:'🔥',room:topic,bot:false,def:false});hist[id]=hist[id]||[];if(mq&&onlineOk){mq.subscribe(topic);pingRoom(contacts.find(x=>x.id===id))}save();sw(id)};
$('avGrid').innerHTML=avas.map((a,i)=>`<div class="av-opt ${i===0?'sel':''}" onclick="pickA(this,'${a}')">${a}</div>`).join('');
window.pickA=(el,a)=>{document.querySelectorAll('#avGrid .av-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selAva=a};
$('openM').onclick=()=>{$('newName').value='';$('modal').classList.add('show');$('newName').focus()};
$('closeM').onclick=()=>$('modal').classList.remove('show');
$('addBtn').onclick=()=>{const name=$('newName').value.trim();if(!name)return;const id='c_'+Date.now(),bot=$('botChk').checked;contacts.unshift({id,name,ava:selAva,bot,def:false});hist[id]=bot?[{t:`Привет! Я ${name} 👋`,type:'in',time:now()}]:[];save();$('modal').classList.remove('show');sw(id)};
$('delBtn').onclick=()=>{if(!confirm('Выйти из этого чата и удалить его?'))return;contacts=contacts.filter(x=>x.id!==curId);delete hist[curId];save();sw(contacts.at(0).id)};
$('emBox').innerHTML=ems.map(e=>`<span class="em" onclick="$('msgIn').value+='${e}'">${e}</span>`).join('');
$('emBtn').onclick=e=>{e.stopPropagation();$('emBox').classList.toggle('show')};document.onclick=()=>$('emBox').classList.remove('show');
$('themeBtn').onclick=()=>document.body.classList.toggle('light');
$('clrBtn').onclick=()=>{hist[curId]=[];save();renderMsgs();renderList()};
$('sendBtn').onclick=()=>send();$('msgIn').onkeypress=e=>{if(e.key==='Enter')send()};
save();updAccUI();sw(curId);
if(!acc)$('accModal').classList.add('show');
</script>
</body>
</html>
